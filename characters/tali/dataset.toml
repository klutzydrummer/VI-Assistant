# Tali's dataset pipeline. `vi dataset run characters/tali/dataset.toml`.
# Formats and caching: docs/design/corpus-format.md. Plan:
# docs/design/control-vector-datasets.md.

corpus = "../../corpus/tali"

# For now harvest imports the extraction already in the corpus
# (corpus/tali/harvest: LE1, LE2 and LE3, made by `vi extract` with
# conversation context). To extract from the game instead (needs
# `vgmstream-cli` on PATH; the first run hashes the whole 118 GB game folder,
# so start it at low priority):
#   command = ["vi", "extract", "--character", ".", "/mnt/data/Media/Games/steam/steamapps/common/Mass Effect Legendary Edition"]
#   files = ["sources.toml", "/mnt/data/Media/Games/steam/steamapps/common/Mass Effect Legendary Edition/Game"]
[stage.harvest]
command = ["sh", "-c", "cp -a \"$VI_CORPUS/harvest/.\" \"$VI_OUT/\""]
files = ["corpus:harvest"]

# GPU. Trims each clip, checks its subtitle with Whisper, measures how much
# it sounds like her (speaker embedding) and its quality (DNSMOS). Flags,
# doesn't drop; see clean.json for the distributions.
[stage.clean]
command = ["../../jobs/on-worker.sh", "python3", "jobs/clean.py"]
inputs = ["harvest"]
files = ["../../jobs/clean.py", "../../jobs/models.py", "../../jobs/vi_job.py",
         "../../jobs/requirements-gpu.txt"]

[stage.clean.settings]
checks = "warn"   # log failed acceptance checks (checks.json); the smoke pipeline fails on them
asr = "openai/whisper-large-v3"
speaker = "speechbrain/spkrec-ecapa-voxceleb"
batch = 16
mismatch_wer = 0.5   # subtitle_mismatch above this (lines of 3+ words)
far_voice_mads = 4   # far_voice this many MADs below her median similarity

# GPU. Embeds and clusters every clip and captions it from its sound alone.
[stage.discover]
command = ["../../jobs/on-worker.sh", "--put", "states.toml", "python3", "jobs/discover.py"]
inputs = ["harvest", "clean"]
files = ["../../jobs/discover.py", "../../jobs/models.py", "../../jobs/vi_job.py",
         "../../jobs/fusion.py", "../../jobs/requirements-gpu.txt", "states.toml"]

[stage.discover.settings]
checks = "warn"   # log failed acceptance checks (checks.json); the smoke pipeline fails on them
emotion = "emotion2vec/emotion2vec_plus_large"  # base mostly encoded clip length
text_embed = "sentence-transformers/all-MiniLM-L6-v2"
audio_llm = "google/gemma-4-12B-it"
compare = 200       # clips also captioned with their words shown
min_cluster = 15
batch = 32         # benchmarked on an A40: 1.1 s/clip vs 1.8 at 8; peak 33 GB
batch_audio_s = 200  # cap on audio seconds per batch (memory grows ~0.07 GB/s of audio)

# GPU. Scores every clip on the variables in states.toml.
[stage.label]
command = ["../../jobs/on-worker.sh", "--put", "states.toml", "python3", "jobs/label.py"]
inputs = ["harvest", "clean", "discover"]
files = ["../../jobs/label.py", "../../jobs/models.py", "../../jobs/vi_job.py",
         "../../jobs/fusion.py", "../../jobs/requirements-gpu.txt", "states.toml"]

[stage.label.settings]
checks = "warn"   # log failed acceptance checks (checks.json); the smoke pipeline fails on them
audio = "emotion2vec/emotion2vec_plus_large"
dimensions = "audeering/wav2vec2-large-robust-12-ft-emotion-msp-dim"
judge = "google/gemma-4-12B-it"
verify_top = 150   # clips per axis the audio LLM rates: the top by the other signals
verify_low = 50    # ... plus this many from the lower half, as a control
batch = 32         # benchmarked on an A40: 1.1 s/clip vs 1.8 at 8; peak 33 GB
batch_audio_s = 200  # cap on audio seconds per batch (memory grows ~0.07 GB/s of audio)

# Home, CPU. Fits the labels to the reviews (reviews.jsonl): a per-axis probe
# on the emotion2vec+ embeddings, fusion weights from each signal's agreement
# with the reviews, and an accuracy table on the random calibration sample.
# Needs numpy and scikit-learn, which NixOS's python lacks, hence nix-shell.
[stage.calibrate]
command = ["nix-shell", "-p", "python3.withPackages (p: [p.numpy p.scikit-learn])",
           "--run", "python3 ../../jobs/calibrate.py"]
inputs = ["harvest", "label"]   # harvest for conversation-grouped folds
files = ["../../jobs/calibrate.py", "../../jobs/fusion.py", "../../jobs/vi_job.py", "corpus:reviews.jsonl"]

[stage.calibrate.settings]
calibration = 150   # the review page's random sample, reviewed first
min_reviews = 30    # per axis, below this the defaults are kept

# GPU, manual: runs only as `vi dataset run characters/tali/dataset.toml steer`.
# Tests whether a steering vector on Qwen3-TTS's backbone moves her cloned
# voice along an axis, against swapping in an emotional reference clip. About
# an hour on an A40. Read report.md, then listen with listen.md.
[stage.steer]
command = ["../../jobs/on-worker.sh", "python3", "jobs/steer.py"]
inputs = ["harvest", "clean", "label"]
files = ["../../jobs/steer.py", "../../jobs/clean.py", "../../jobs/models.py",
         "../../jobs/vi_job.py", "../../jobs/fusion.py", "../../jobs/requirements-steer.txt"]
manual = true

[stage.steer.settings]
model = "Qwen/Qwen3-TTS-12Hz-1.7B-Base"
designer = "Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign"
axis_ids = ["anger", "intoxication"]
sources = ["tali", "designed"]   # vectors from her clips, and from designed pairs
refs_per_side = 12
design_pairs = 6
strengths = [0.5, 1, 2, 4]       # times the mean difference, added at each steered layer
# layers = [9, 10, ..., 18]      # default: the middle third of the 28 talker layers
max_similarity_drop = 0.05       # voice: ECAPA cosine to her may fall this much
max_wer = 0.15                   # words: Whisper's word error rate at most this

# Hand-picked clip ids win over label's top clips, e.g. drunk lines from the
# Citadel party while scene tags are still missing:
[stage.steer.settings.refs]
# intoxication = ["le3.s...", ...]
