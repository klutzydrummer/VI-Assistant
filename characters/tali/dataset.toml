# Tali's dataset pipeline. `vi dataset run characters/tali/dataset.toml`.
# Formats and caching: docs/design/corpus-format.md. Plan:
# docs/design/corpus-pipeline.md. The old discover, label and calibrate stages
# are not part of it; their jobs stay in jobs/.

corpus = "../../corpus/tali"

# For now harvest imports the extraction already in the corpus
# (corpus/tali/harvest: LE1, LE2 and LE3, made by `vi extract` with
# conversation context). To extract from the game instead (needs
# `vgmstream-cli` on PATH; the first run hashes the whole 118 GB game folder,
# so start it at low priority):
#   command = ["vi", "extract", "--character", ".", "/mnt/data/Media/Games/steam/steamapps/common/Mass Effect Legendary Edition"]
#   files = ["sources.toml", "/mnt/data/Media/Games/steam/steamapps/common/Mass Effect Legendary Edition/Game"]
[stage.harvest]
command = ["sh", "-c", "cp -a \"$VI_CORPUS/harvest/.\" \"$VI_OUT/\""]
files = ["corpus:harvest"]

# Home, CPU. One trim and level for every clip: measures the noise floor in
# the silence it trims, trims, applies one linear gain, and writes a 16 kHz
# copy for embedding (the 24 kHz originals stay as they are). Low priority:
# it reads the corpus on the busy system disk. numpy, scipy and soundfile
# come from nix-shell.
[stage.prep]
command = ["nice", "-n", "19", "ionice", "-c2", "-n7",
           "nix-shell", "-p", "python3.withPackages (p: [p.numpy p.scipy p.soundfile])",
           "--run", "python3 ../../jobs/prep.py"]
inputs = ["harvest"]
files = ["../../jobs/prep.py", "../../jobs/checks.py", "../../jobs/vi_job.py"]

[stage.prep.settings]
checks = "warn"
top_db = 40          # trim where frames fall this far below the loudest
pad_s = 0.05         # silence kept at each end
target_lufs = -23    # one linear gain to this (BS.1770; RMS under rms_below_s)
rms_below_s = 1.0
max_peak_dbfs = -1   # the gain is capped so peaks stay under this
bands = 16           # noise-floor spectrum bands, 50 Hz to 7.6 kHz

# GPU. Cuts each clip at prep's bounds, checks its subtitle with Whisper
# (not barks, which have none), measures how much it sounds like her (speaker
# embedding) and its quality (DNSMOS, reported only). Flags, doesn't drop;
# see clean.json for the distributions.
[stage.clean]
command = ["../../jobs/on-worker.sh", "python3", "jobs/clean.py"]
inputs = ["harvest", "prep"]
files = ["../../jobs/clean.py", "../../jobs/models.py", "../../jobs/vi_job.py",
         "../../jobs/requirements-gpu.txt"]

[stage.clean.settings]
checks = "warn"   # log failed acceptance checks (checks.json); the smoke pipeline fails on them
asr = "openai/whisper-large-v3"
speaker = "speechbrain/spkrec-ecapa-voxceleb"
batch = 16
mismatch_wer = 0.5   # subtitle_mismatch above this (lines of 3+ words)
far_voice_mads = 4   # far_voice this many MADs below her median similarity

