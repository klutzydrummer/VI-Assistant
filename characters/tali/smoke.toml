# 40-clip smoke test of the GPU stages. `vi dataset run characters/tali/smoke.toml`.
# Same as dataset.toml except harvest copies a fixed 40-line subset of the
# real harvest (mixed games, barks, nonverbal, stage directions, one long clip)
# into its own corpus folder, and discovery's thresholds are scaled down.

corpus = "/home/brandon/Projects/VI-Assistant/corpus/tali-smoke"

[stage.harvest]
command = ["python3", "-c", """
import json, os, random, shutil
src = '/home/brandon/Projects/VI-Assistant/corpus/tali/harvest'
out = os.environ['VI_OUT']
rows = [json.loads(l) for l in open(f'{src}/lines.jsonl')]
rnd = random.Random(7)
def pick(pred, n):
    pool = [r for r in rows if pred(r) and r not in chosen]
    chosen.extend(rnd.sample(pool, n))
chosen = []
flags = lambda r: r.get('flags') or []
pick(lambda r: 'bark' in flags(r), 4)
pick(lambda r: 'nonverbal' in flags(r), 3)
pick(lambda r: r.get('stage_direction'), 5)
pick(lambda r: r['audio']['duration_s'] > 10, 2)
for game in ('le1', 'le2', 'le3'):
    pick(lambda r: r['source']['game'] == game and not flags(r), 26 // 3 + (game == 'le3') * 2)
assert len(chosen) == 40, len(chosen)
os.makedirs(f'{out}/audio')
with open(f'{out}/lines.jsonl', 'w') as f:
    for r in chosen:
        f.write(json.dumps(r) + '\\n')
        shutil.copy2(f"{src}/{r['audio']['path']}", f"{out}/{r['audio']['path']}")
"""]
files = ["/home/brandon/Projects/VI-Assistant/corpus/tali/harvest"]

[stage.clean]
command = ["../../jobs/on-worker.sh", "python3", "jobs/clean.py"]
inputs = ["harvest"]
files = ["../../jobs/clean.py", "../../jobs/models.py", "../../jobs/vi_job.py",
         "../../jobs/requirements-gpu.txt"]

[stage.clean.settings]
asr = "openai/whisper-large-v3"
speaker = "speechbrain/spkrec-ecapa-voxceleb"
batch = 16
mismatch_wer = 0.5
far_voice_mads = 4

[stage.discover]
command = ["../../jobs/on-worker.sh", "--put", "states.toml", "python3", "jobs/discover.py"]
inputs = ["harvest", "clean"]
files = ["../../jobs/discover.py", "../../jobs/models.py", "../../jobs/vi_job.py",
         "../../jobs/fusion.py", "../../jobs/requirements-gpu.txt", "states.toml"]

[stage.discover.settings]
emotion = "emotion2vec/emotion2vec_base"
text_embed = "sentence-transformers/all-MiniLM-L6-v2"
audio_llm = "google/gemma-4-12B-it"
compare = 10
min_cluster = 5
batch = 32         # benchmarked on an A40: 1.1 s/clip vs 1.8 at 8; peak 33 GB
batch_audio_s = 200  # cap on audio seconds per batch (memory grows ~0.07 GB/s of audio)

[stage.label]
command = ["../../jobs/on-worker.sh", "--put", "states.toml", "python3", "jobs/label.py"]
inputs = ["harvest", "clean", "discover"]
files = ["../../jobs/label.py", "../../jobs/models.py", "../../jobs/vi_job.py",
         "../../jobs/fusion.py", "../../jobs/requirements-gpu.txt", "states.toml"]

[stage.label.settings]
audio = "emotion2vec/emotion2vec_plus_large"
dimensions = "audeering/wav2vec2-large-robust-12-ft-emotion-msp-dim"
judge = "google/gemma-4-12B-it"
verify_top = 10   # clips per axis the audio LLM rates: the top by the other signals
verify_low = 5    # ... plus this many from the lower half, as a control
batch = 32         # benchmarked on an A40: 1.1 s/clip vs 1.8 at 8; peak 33 GB
batch_audio_s = 200  # cap on audio seconds per batch (memory grows ~0.07 GB/s of audio)

# Home, CPU. Fits the labels to the reviews (reviews.jsonl): a per-axis probe
# on the emotion2vec+ embeddings, fusion weights from each signal's agreement
# with the reviews, and an accuracy table on the random calibration sample.
# Needs numpy and scikit-learn, which NixOS's python lacks, hence nix-shell.
[stage.calibrate]
command = ["nix-shell", "-p", "python3.withPackages (p: [p.numpy p.scikit-learn])",
           "--run", "python3 ../../jobs/calibrate.py"]
inputs = ["label"]
files = ["../../jobs/calibrate.py", "../../jobs/fusion.py", "../../jobs/vi_job.py", "corpus:reviews.jsonl"]

[stage.calibrate.settings]
calibration = 10
min_reviews = 10
