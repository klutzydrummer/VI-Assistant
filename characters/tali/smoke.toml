# 40-clip smoke test of the corpus pipeline. `vi dataset run characters/tali/smoke.toml`.
# Same as dataset.toml except harvest copies a fixed 40-line subset of the
# real harvest (mixed games, barks, nonverbal, stage directions, one long clip)
# into its own corpus folder.

corpus = "/home/brandon/Projects/VI-Assistant/corpus/tali-smoke"

[stage.harvest]
command = ["python3", "-c", """
import json, os, random, shutil
src = '/home/brandon/Projects/VI-Assistant/corpus/tali/harvest'
out = os.environ['VI_OUT']
rows = [json.loads(l) for l in open(f'{src}/lines.jsonl')]
rnd = random.Random(7)
def pick(pred, n):
    pool = [r for r in rows if pred(r) and r not in chosen]
    chosen.extend(rnd.sample(pool, n))
chosen = []
flags = lambda r: r.get('flags') or []
pick(lambda r: 'bark' in flags(r), 4)
pick(lambda r: 'nonverbal' in flags(r), 3)
pick(lambda r: r.get('stage_direction'), 5)
pick(lambda r: r['audio']['duration_s'] > 10, 2)
for game in ('le1', 'le2', 'le3'):
    pick(lambda r: r['source']['game'] == game and not flags(r), 26 // 3 + (game == 'le3') * 2)
assert len(chosen) == 40, len(chosen)
os.makedirs(f'{out}/audio')
with open(f'{out}/lines.jsonl', 'w') as f:
    for r in chosen:
        f.write(json.dumps(r) + '\\n')
        shutil.copy2(f"{src}/{r['audio']['path']}", f"{out}/{r['audio']['path']}")
"""]
files = ["/home/brandon/Projects/VI-Assistant/corpus/tali/harvest"]

# Home, CPU. One trim and level for every clip: measures the noise floor in
# the silence it trims, trims, applies one linear gain, and writes a 16 kHz
# copy for embedding (the 24 kHz originals stay as they are). Low priority:
# it reads the corpus on the busy system disk. numpy, scipy and soundfile
# come from nix-shell.
[stage.prep]
command = ["nice", "-n", "19", "ionice", "-c2", "-n7",
           "nix-shell", "-p", "python3.withPackages (p: [p.numpy p.scipy p.soundfile])",
           "--run", "python3 ../../jobs/prep.py"]
inputs = ["harvest"]
files = ["../../jobs/prep.py", "../../jobs/checks.py", "../../jobs/vi_job.py"]

[stage.prep.settings]
checks = "fail"
top_db = 40          # trim where frames fall this far below the loudest
pad_s = 0.05         # silence kept at each end
target_lufs = -23    # one linear gain to this (BS.1770; RMS under rms_below_s)
rms_below_s = 1.0
max_peak_dbfs = -1   # the gain is capped so peaks stay under this
bands = 16           # noise-floor spectrum bands, 50 Hz to 7.6 kHz

[stage.clean]
command = ["../../jobs/on-worker.sh", "python3", "jobs/clean.py"]
inputs = ["harvest", "prep"]
files = ["../../jobs/clean.py", "../../jobs/models.py", "../../jobs/vi_job.py",
         "../../jobs/requirements-gpu.txt"]

[stage.clean.settings]
checks = "fail"   # fail the stage if an acceptance check fails (checks.json)
asr = "openai/whisper-large-v3"
speaker = "speechbrain/spkrec-ecapa-voxceleb"
batch = 16
mismatch_wer = 0.5
far_voice_mads = 4
