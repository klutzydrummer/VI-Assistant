[package]
name = "cloud"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Rents, watches and releases VI Assistant's Vast.ai GPU worker"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
ureq = { version = "2", features = ["json", "native-certs"] }

[dev-dependencies]
tempfile = "3"
