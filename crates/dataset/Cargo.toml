[package]
name = "dataset"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Corpus format and the cached stage runner for VI Assistant's dataset pipeline"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.8"
sha2 = "0.10"
humantime = "2"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
