[package]
name = "vi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "VI Assistant command-line tool"

[features]
# GPU backends for the embedded dialogue model.
cuda = ["llm/cuda"]
vulkan = ["llm/vulkan"]

[dependencies]
charpack = { path = "../charpack" }
cloud = { path = "../cloud" }
engine = { path = "../engine" }
llm = { path = "../llm" }
dataset = { path = "../dataset" }
harvest = { path = "../harvest" }
review = { path = "../review" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
ureq = { version = "2", features = ["native-certs"] }

[dev-dependencies]
tempfile = "3"
