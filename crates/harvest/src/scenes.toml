# Scene tags: where a line is spoken and in what situation.
#
# Read by `harvest::scenes` for every harvested line, from three things a
# record already carries: the level code (`scene.prefix`, the package name
# up to its second underscore), the DLC folder (`scene.dlc`) and the
# conversation name. Tags are lowercase with underscores
# (docs/design/corpus-format.md, "harvest"). Character-specific tags (whose
# own story a scene is) live in each pack's sources.toml instead.
#
# Sources:
# - Level codes and their places: the Mass Effect Wiki's console level
#   lists, "PC Tweaks" (LE1), "PC Tweaks (Mass Effect 2)" and
#   "PC Tweaks (Mass Effect 3)" at masseffect.fandom.com.
# - DLC folders: matched to their DLC by the levels and conversations inside
#   them on the install (e.g. DLC_UNC_Hammer01 holds BioD_N7Ruins and
#   BioD_N7Shipwreck, which the wiki lists as Project Firewalker missions).
# - Conversation keywords: BioWare's naming, checked by reading the lines
#   each keyword selects in Tali's corpus.
#
# Level codes match case-insensitively on the part after the package type
# (`BioD_`, `BioA_`, `BioSnd_`, `BIOA_`), so `BioA_Gth001` and `BioD_Gth001`
# share an entry. LE1 codes are an area plus a number (`NOR10`); the area
# entry applies unless the full code has its own.

# --- LE1 -------------------------------------------------------------------
[le1.levels]
NOR = ["normandy"]
STA = ["citadel", "hub"]
PRO = ["eden_prime", "main_mission", "prologue"]
WAR = ["feros", "main_mission"]
ICE = ["noveria", "main_mission"]
LAV = ["therum", "main_mission"]
JUG = ["virmire", "main_mission"]
LOS = ["ilos", "main_mission"]
END = ["citadel", "main_mission", "endgame"]
# Uncharted worlds (side missions on planets named in the wiki's list).
UNC = ["uncharted_world", "side_mission"]
UNC17 = ["antibaar", "uncharted_world", "side_mission"]
UNC20 = ["trebin", "uncharted_world", "side_mission"]
UNC24 = ["altahe", "uncharted_world", "side_mission"]
UNC25 = ["edolus", "uncharted_world", "side_mission"]
UNC53 = ["agebinium", "uncharted_world", "side_mission"]
UNC54 = ["presrop", "uncharted_world", "side_mission"]
UNC73 = ["nepmos", "uncharted_world", "side_mission"]
UNC81 = ["chasca", "uncharted_world", "side_mission"]
UNC84 = ["eletania", "uncharted_world", "side_mission"]
UNC92 = ["binthu", "uncharted_world", "side_mission"]
# Freighter side missions.
FRE = ["freighter", "side_mission"]

