MPCer = ["firebase_glacier", "n7_assignment"]
MPDish = ["firebase_dagger", "n7_assignment"]
MPNov = ["firebase_white", "n7_assignment"]
MPRctr = ["firebase_reactor", "n7_assignment"]
MPSlum = ["firebase_ghost", "n7_assignment"]
MPTowr = ["firebase_giant", "n7_assignment"]
SPCer = ["n7_assignment"]
SPDish = ["n7_assignment"]
SPNov = ["n7_assignment"]
SPRctr = ["n7_assignment"]
SPSlum = ["n7_assignment"]
SPTowr = ["n7_assignment"]
# Citadel DLC: the mission (Cit001 to Cit004), the apartment, the casino.
Cit001 = ["citadel", "citadel_dlc"]
Cit002 = ["citadel", "citadel_dlc"]
Cit003 = ["citadel", "citadel_dlc"]
Cit004 = ["citadel", "citadel_dlc"]
CitApt = ["citadel", "citadel_dlc", "apartment"]
CitCas = ["citadel", "citadel_dlc", "casino"]
# Leviathan DLC. The wiki's level list doesn't name these, so they're
# matched by content to the DLC's missions (Wikipedia, "Mass Effect 3:
# Leviathan"; Mass Effect Wiki, "Namakli", "Mahavid", "2181 Despoina"):
# Lev002 holds the mining site with enthralled workers (Mahavid), Lev003
# the meeting with Ann Bryson (Namakli), Lev004 the descent in a diving suit
# (2181 Despoina). Lev001 is Dr. Bryson's lab on the Citadel.
Lev001 = ["citadel", "leviathan_dlc"]
Lev002 = ["mahavid", "leviathan_dlc"]
Lev003 = ["namakli", "leviathan_dlc"]
Lev004 = ["despoina", "leviathan_dlc"]

# DLC folders, for lines in a DLC whose level isn't listed above.
[le2.dlc]
DLC_UNC_Hammer01 = ["firewalker_dlc"]
DLC_UNC_Pack01 = ["overlord_dlc"]

[le3.dlc]
DLC_EXP_Pack001 = ["leviathan_dlc"]
DLC_EXP_Pack003 = ["citadel_dlc"]
DLC_EXP_Pack003_Base = ["citadel_dlc"]
DLC_HEN_PR = ["from_ashes_dlc"]
DLC_CON_END = ["extended_cut"]

# --- Situation, from conversation names (all games) -------------------------
# A keyword matches a whole part of the conversation name between
# underscores or digits: `sta20_banter_00` has the parts sta, banter.
[conversation_keywords]
banter = ["squad_banter"]
amb = ["ambient"]
ambs = ["ambient"]
ambient = ["ambient"]
ambientmaster = ["ambient"]
# Romance scenes: nortl_culmination_h is the LE2 romance culmination; the
# Citadel DLC uses loveint / lovei / love interest.
rom = ["romance"]
romance = ["romance"]
culmination = ["romance"]
loveint = ["romance"]
lovei = ["romance"]
love = ["romance"]
# LE3 norhen_<who>_mr_<mission>: a squadmate's reaction after a mission.
mr = ["mission_reaction"]
debrief = ["debrief"]
# LE3 citpar_*: the Citadel DLC party.
citpar = ["citadel_party"]
radio = ["radio"]
dream = ["dream"]
combat = ["combat"]
fight = ["combat"]
firefight = ["combat"]
ambush = ["combat"]
# Squad sound sets (ss_global_hench_tali, ss_tali_minimal): combat barks.
ss = ["combat"]
# LE1 trigger and interjection conversations: the squad commenting on the
# place or on someone else's conversation.
trig = ["squad_comment"]
trigger = ["squad_comment"]
triggers = ["squad_comment"]
interject = ["squad_comment"]

# Whole-name patterns, where a single keyword would catch other scenes.
# `*` matches any run of characters.
[conversation_patterns]
# LE1 nor20_<mission>_done: the Normandy debrief after a mission (unlike
# los30_security_system_done, a door opening on Ilos).
"nor20_*_done" = ["debrief"]
# LE3 shuttle rides to a mission (cat002_shuttle_ride_m, cermir_shuttle_down_m).
"*_shuttle_ride_*" = ["shuttle"]
"*_shuttle_down_*" = ["shuttle"]
"*_shuttledown_*" = ["shuttle"]
"*_shuttle_m" = ["shuttle"]

# Conversations that play anywhere, so the package they happen to be stored
# in says nothing about where they're heard: only their keyword and pattern
# tags apply: the squad sound sets (ss_*) and LE1's generic combat banter
# (combat_banter_00, stored in the otherwise unlisted BIOA_CRD00).
[global_conversations]
patterns = ["ss_*", "combat_banter_*"]
