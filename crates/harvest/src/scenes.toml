Nor = ["normandy"]
CitHub = ["citadel", "hub"]
ProEar = ["earth", "main_mission", "prologue"]
ProMar = ["mars", "main_mission"]
Kro001 = ["sur_kesh", "main_mission"]
Kro002 = ["tuchanka", "main_mission"]
KroGar = ["palaven", "main_mission"]
KroGru = ["attican_traverse", "side_mission"]
KroN7a = ["tuchanka", "n7_assignment"]
KroN7b = ["tuchanka", "n7_assignment"]
CerMir = ["horizon", "main_mission"]
CerJcb = ["arrae", "side_mission"]
CitSam = ["ardat_yakshi_monastery", "side_mission"]
OmgJck = ["grissom_academy", "side_mission"]
Gth001 = ["geth_dreadnought", "main_mission"]
Gth002 = ["rannoch", "main_mission"]
GthLeg = ["rannoch", "side_mission"]
GthN7a = ["rannoch", "side_mission"]
