<style>
  #hubbar { display: flex; gap: 10px; align-items: center; padding: 8px 16px; font: 14px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #dbe7f5; color: #1d1d1b; border-bottom: 1px solid #c9d8ea; }
  #hubbar a { color: inherit; font-weight: 600; text-decoration: none; white-space: nowrap; }
  #hubbar .hb-state { flex: 1; text-align: right; }
  #hubbar.hb-done { background: #2e7d4f; color: #fff; border-color: #2e7d4f; }
  #hubbar.hb-done .hb-state { font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    #hubbar { background: #23344a; color: #ecebe6; border-color: #2d4360; }
    #hubbar.hb-done { background: #2e6b47; color: #fff; }
  }
</style>
<div id="hubbar"><a href="/">&lsaquo; All tasks</a><span class="hb-state" id="hubbar-state"></span></div>
<script>
(() => {
  const id = __TASK__;
  const bar = document.getElementById("hubbar"), state = document.getElementById("hubbar-state");
  let wasDone = null;
  async function tick() {
    try {
      const r = await fetch("/api/task?id=" + encodeURIComponent(id), { cache: "no-store" });
      if (!r.ok) return;
      const t = await r.json();
      if (t.complete) {
        bar.classList.add("hb-done");
        state.textContent = "✓ Done. Nothing more needed here.";
        if (wasDone === false) bar.scrollIntoView({ behavior: "smooth" });
      } else {
        bar.classList.remove("hb-done");
        state.textContent = `${t.title}: ${t.done} of ${t.total} ${t.unit}`;
      }
      wasDone = t.complete;
    } catch (e) {}
  }
  tick();
  setInterval(tick, 4000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
})();
</script>
